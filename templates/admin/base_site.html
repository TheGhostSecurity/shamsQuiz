{% extends "admin/base_site.html" %}

{% block extrahead %}
    {{ block.super }}
    <style>
        :root {
            --primary: #0067c0;
            --primary-hover: #005a9e;
            --secondary: #005a9e;
            --accent: #37a5ff;
            --link-fg: #0067c0;
            --link-selected-fg: #005a9e;
            --header-bg: #001f2e;
            --header-height: 56px;
            --breadcrumbs-bg: #002b3f;
            --sidebar-bg: #002b3f;
            --body-bg: #f7f7f7;
        }
        .shams-logo {
            display: inline-block;
            width: 26px;
            height: 26px;
            margin-right: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #54b6ff, #37a5ff);
            box-shadow: 0 2px 10px rgba(0, 103, 192, .5);
            vertical-align: middle;
            position: relative;
        }
        .shams-logo::after {
            content: '';
            position: absolute;
            inset: 7px;
            border-radius: 50%;
            background: #005a9e;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #54b6ff;
                --primary-hover: #37a5ff;
                --secondary: #93c5fd;
                --accent: #37a5ff;
                --link-fg: #93c5fd;
                --link-selected-fg: #b7d8ff;
                --header-bg: #001f2e;
                --breadcrumbs-bg: #002b3f;
                --sidebar-bg: #002b3f;
                --body-bg: #0b1622;
            }
        }
        #header {
            background: linear-gradient(90deg, #001f2e, #005a9e);
        }
        #branding h1 a:link, #branding h1 a:visited {
            color: #eaf4ff;
            font-weight: 700;
            letter-spacing: .3px;
        }
        #site-name .view-site {
            margin-left: 14px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, .78);
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 999px;
            padding: 4px 12px;
            vertical-align: middle;
        }
        #site-name .view-site:hover { background: rgba(255, 255, 255, .22); color: #fff; }
        .module h2, .module caption {
            background: var(--breadcrumbs-bg);
            color: #fff;
            border-radius: 8px;
        }
        .module { border: 1px solid #e5edf5; border-radius: 12px; box-shadow: 0 1px 3px rgba(0, 0, 0, .04); }
        .module table { border-radius: 10px; overflow: hidden; }
        .aligned label { color: #242424; }
        .welcome-banner {
            background: linear-gradient(120deg, #001f2e, #0067c0 55%, #54b6ff);
            color: #fff;
            border-radius: 14px;
            padding: 20px 24px;
            margin: 0 0 26px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(0, 103, 192, .25);
        }
        .welcome-banner .sun {
            flex: 0 0 auto;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #54b6ff, #37a5ff);
            display: grid;
            place-items: center;
            box-shadow: 0 2px 10px rgba(0, 103, 192, .5);
        }
        .welcome-banner .sun:before {
            content: '';
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #005a9e;
        }
        .welcome-banner h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; color: #fff; }
        .welcome-banner p { margin: 0; color: rgba(255, 255, 255, .8); font-size: 13px; }
        @media (prefers-color-scheme: dark) {
            .module { border-color: #16324a; }
            .aligned label { color: #dbeafe; }
        }
    </style>
{% endblock %}

{% block branding %}
    <div id="site-name">
        <a href="{% url 'admin:index' %}">
            <span class="shams-logo"></span> ShamsQuiz Admin
        </a>
        <a class="view-site" href="{% url 'home' %}" target="_blank" rel="noopener">View site ↗</a>
    </div>
{% endblock %}

{% block nav-global %}{% endblock %}
