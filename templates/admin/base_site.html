{% extends "admin/base_site.html" %}

{% block extrahead %}
    {{ block.super }}
    <style>
        :root {
            --primary: #6d28d9;
            --primary-hover: #5b21b6;
            --secondary: #4c1d95;
            --accent: #f59e0b;
            --link-fg: #6d28d9;
            --link-selected-fg: #5b21b6;
            --header-bg: #120b2e;
            --header-height: 56px;
            --breadcrumbs-bg: #3b0f7a;
            --sidebar-bg: #170e38;
            --body-bg: #f7f7fb;
        }
        .shams-logo {
            display: inline-block;
            width: 26px;
            height: 26px;
            margin-right: 8px;
            border-radius: 8px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            box-shadow: 0 2px 10px rgba(245, 158, 11, .5);
            vertical-align: middle;
            position: relative;
        }
        .shams-logo::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            background: #7b3f00;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #9470fb;
                --primary-hover: #b7a1ff;
                --secondary: #b7a1ff;
                --accent: #fbbf24;
                --link-fg: #b7a1ff;
                --link-selected-fg: #d5c9ff;
                --header-bg: #0b051e;
                --breadcrumbs-bg: #2a0f68;
                --sidebar-bg: #100a2c;
                --body-bg: #15102b;
            }
        }
        #header {
            background: linear-gradient(90deg, #120b2e, #3b0f7a);
        }
        #branding h1 a:link, #branding h1 a:visited {
            color: #f5f3ff;
            font-weight: 700;
            letter-spacing: .3px;
        }
        #site-name .view-site {
            margin-left: 14px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, .78);
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 999px;
            padding: 4px 12px;
            vertical-align: middle;
        }
        #site-name .view-site:hover { background: rgba(255, 255, 255, .22); color: #fff; }
        .module h2, .module caption {
            background: var(--breadcrumbs-bg);
            color: #fff;
            border-radius: 8px;
        }
        .module { border: 1px solid #e8e4f5; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
        .module table { border-radius: 10px; overflow: hidden; }
        .aligned label { color: #242424; }
        .welcome-banner {
            background: linear-gradient(120deg, #120b2e, #4c1d95 55%, #7b3f00);
            color: #fff;
            border-radius: 14px;
            padding: 20px 24px;
            margin: 0 0 26px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(76, 29, 149, .25);
        }
        .welcome-banner .sun {
            flex: 0 0 auto;
            width: 52px; height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            display: grid; place-items: center;
        }
        .welcome-banner .sun:before {
            content: '';
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #7b3f00;
        }
        .welcome-banner h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; color: #fff; }
        .welcome-banner p { margin: 0; color: rgba(255,255,255,.75); font-size: 13px; }
        @media (prefers-color-scheme: dark) {
            .module { border-color: #2a2450; }
            .aligned label { color: #e4e4f0; }
        }
    </style>
{% endblock %}

{% block branding %}
    <div id="site-name">
        <a href="{% url 'admin:index' %}">
            <span class="shams-logo"></span> ShamsQuiz Admin
        </a>
        <a class="view-site" href="{% url 'home' %}" target="_blank" rel="noopener">View site ↗</a>
    </div>
{% endblock %}

{% block nav-global %}{% endblock %}
