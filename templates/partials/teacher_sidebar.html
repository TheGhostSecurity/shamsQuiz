<aside class="fixed inset-y-0 left-0 z-40 flex w-60 flex-col border-r border-[#e7e7e7] bg-white">
    <div class="flex items-center gap-2.5 px-5 py-5">
        <a href="{% url 'home' %}" class="flex items-center gap-2.5">
            <span class="relative block h-7 w-10 shrink-0">
                <span class="absolute left-0 top-2 h-4 w-7 rounded-full bg-[#0078d4]"></span>
                <span class="absolute right-0 top-1 h-5 w-7 rounded-full bg-[#37a5ff]"></span>
                <span class="absolute left-3 top-0 h-7 w-7 rounded-full bg-gradient-to-br from-[#54b6ff] to-[#005a9e]"></span>
            </span>
            <span class="text-lg font-bold tracking-tight text-black">ShamsQuiz</span>
        </a>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-2">
        <a class="flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'dashboard' %}bg-[#eaf4ff] text-[#0067c0]{% else %}text-[#424242] hover:bg-[#f3f3f3]{% endif %}" href="{% url 'dashboard' %}">
            <i data-lucide="layout-dashboard" class="h-4 w-4"></i>
            Overview
        </a>
        <a class="flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'module_list' %}bg-[#eaf4ff] text-[#0067c0]{% else %}text-[#424242] hover:bg-[#f3f3f3]{% endif %}" href="{% url 'module_list' %}">
            <i data-lucide="folder" class="h-4 w-4"></i>
            Your modules
        </a>
        <a class="flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'teacher_history' %}bg-[#eaf4ff] text-[#0067c0]{% else %}text-[#424242] hover:bg-[#f3f3f3]{% endif %}" href="{% url 'teacher_history' %}">
            <i data-lucide="chart-column-big" class="h-4 w-4"></i>
            History &amp; Reports
        </a>
        <a class="flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'bank' %}bg-[#eaf4ff] text-[#0067c0]{% else %}text-[#424242] hover:bg-[#f3f3f3]{% endif %}" href="{% url 'bank' %}">
            <i data-lucide="library" class="h-4 w-4"></i>
            Question bank
        </a>
    </nav>

    <div class="space-y-1 border-t border-[#ededed] px-3 py-3">
        <div class="flex items-center justify-between gap-2">
            {% include "partials/theme_toggle.html" %}
            <a class="flex flex-1 items-center justify-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-[#424242] hover:bg-[#f3f3f3]" href="{% url 'home' %}" target="_blank" rel="noopener">
                <i data-lucide="external-link" class="h-4 w-4"></i>
                View site
            </a>
        </div>
        {% if request.user.is_staff %}
            <a class="flex items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-semibold text-[#424242] hover:bg-[#f3f3f3]" href="{% url 'admin:index' %}">
                <i data-lucide="shield-check" class="h-4 w-4"></i>
                Admin panel
            </a>
        {% endif %}
        <form action="{% url 'logout' %}" method="post" class="contents">
            {% csrf_token %}
            <button class="flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-sm font-semibold text-[#424242] hover:bg-[#f3f3f3]" type="submit">
                <i data-lucide="log-out" class="h-4 w-4"></i>
                Log out
            </button>
        </form>
    </div>
</aside>
