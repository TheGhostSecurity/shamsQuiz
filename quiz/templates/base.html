<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta_description %}ShamsQuiz — join live quizzes with a code, or create your own question modules.{% endblock %}">
    <title>{% block title %}ShamsQuiz{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eaf4ff', 100: '#d8ecff', 200: '#b7d8ff',
                            300: '#93c5fd', 400: '#37a5ff', 500: '#0078d4',
                            600: '#0067c0', 700: '#005a9e', 800: '#004f8f',
                            900: '#003a6b',
                        },
                        sun: {400: '#e8a63d', 500: '#d99322', 600: '#c47019'},
                        navy: {800: '#002b3f', 900: '#001f2e'},
                    },
                },
            },
        };
    </script>
    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}bg-[#f7f7f7] text-[#1f1f1f] antialiased{% endblock %}">
    {% block topbar %}{% endblock %}

    {% if messages %}
        <div class="{% block messages_wrap %}mx-auto mt-4 max-w-6xl space-y-2 px-4{% endblock %}">
            {% for message in messages %}
                <div class="flex items-center justify-between gap-3 rounded-lg border border-[#b7d8ff] bg-[#eaf4ff] px-4 py-3 text-sm text-[#005a9e]">
                    <span>{{ message }}</span>
                    <button class="shrink-0 text-[#0067c0] hover:text-[#002b3f]" onclick="this.parentElement.remove()" type="button">
                        <i data-lucide="x" class="h-4 w-4"></i>
                    </button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="{% block main_class %}mx-auto max-w-6xl px-4 py-8{% endblock %}">
        {% block content %}{% endblock %}
    </main>

    <script>
        function getCookie(name) {
            var match = document.cookie.match(new RegExp('(^|; )' + name + '=([^;]*)'));
            return match ? decodeURIComponent(match[2]) : null;
        }
        function csrfSafe() { return { 'X-CSRFToken': getCookie('csrftoken') }; }
        function postJSON(url, data) {
            return fetch(url, {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/x-www-form-urlencoded' }, csrfSafe()),
                body: new URLSearchParams(data || {}).toString()
            }).then(function (r) { return r.json(); });
        }
        if (window.lucide) {
            window.lucide.createIcons();
        }
        document.addEventListener('DOMContentLoaded', function () {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
